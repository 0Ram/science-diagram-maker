<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Dark subtle linear gradients -->
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="stage1Glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="stage2Glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="stage3Glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f87171"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24"/>
    </marker>
  </defs>

  <style>
    .title-text { font-family: system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: 700; fill: #f8fafc; }
    .subtitle-text { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 400; fill: #94a3b8; }
    .stage-title { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 700; }
    .label-bold { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 700; }
    .label-dim { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 400; fill: #94a3b8; }
    .formula-badge { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 12px; font-weight: 700; }

    /* Animations */
    @keyframes pulseBalance {
      0%, 100% { opacity: 0.85; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.02); }
    }
    .pulsing-box {
      transform-origin: 150px 210px;
      animation: pulseBalance 3s ease-in-out infinite;
    }

    @keyframes smoothGlide {
      0% { transform: translateX(0px); }
      100% { transform: translateX(100px); }
    }
    .gliding-cart {
      animation: smoothGlide 2.5s linear infinite;
    }

    @keyframes impactCollision {
      0% { transform: translateX(0px); }
      50% { transform: translateX(70px); }
      55% { transform: translateX(67px); }
      85% { transform: translateX(67px); }
      100% { transform: translateX(0px); }
    }
    .collision-cart {
      animation: impactCollision 4s ease-in-out infinite;
    }

    @keyframes inertiaPassenger {
      0% { transform: translateX(0px); }
      50% { transform: translateX(70px); }
      58% { transform: translateX(88px) rotate(15deg); }
      85% { transform: translateX(88px) rotate(15deg); }
      100% { transform: translateX(0px) rotate(0deg); }
    }
    .inertia-mass {
      transform-origin: 590px 200px;
      animation: inertiaPassenger 4s ease-in-out infinite;
    }
  </style>

  <!-- Background Base -->
  <rect x="0" y="0" width="800" height="500" rx="16" fill="#090d16"/>

  <!-- Top Title Banner -->
  <title>Newton's First Law of Motion</title>
  <text x="35" y="45" class="title-text">Newton's First Law of Motion: The Law of Inertia</text>
  <text x="35" y="70" class="subtitle-text">Objects stay still or move at constant velocity unless an unbalanced resultant force acts.</text>

  <!-- ================= STAGE 1: AT REST ================= -->
  <g id="stage1">
    <!-- Stage Card Container -->
    <rect x="35" y="95" width="230" height="315" rx="12" fill="url(#cardBg)" stroke="#1e293b" stroke-width="1.5"/>
    <!-- Header Badge -->
    <rect x="47" y="107" width="206" height="28" rx="6" fill="#0369a1" fill-opacity="0.35" stroke="#38bdf8" stroke-width="1"/>
    <text x="150" y="126" text-anchor="middle" class="stage-title" fill="#38bdf8">Stage 1: Stationary Object</text>

    <!-- Visual Area -->
    <!-- Floor Surface -->
    <line x1="50" y1="230" x2="250" y2="230" stroke="#475569" stroke-width="3" stroke-dasharray="4 4"/>
    <rect x="50" y="231" width="200" height="8" fill="#1e293b"/>

    <!-- Stationary Object -->
    <g class="pulsing-box">
      <rect x="115" y="180" width="70" height="50" rx="6" fill="#0284c7" stroke="#bae6fd" stroke-width="2"/>
      <text x="150" y="210" text-anchor="middle" class="label-bold" fill="#ffffff">Mass (m)</text>
    </g>

    <!-- Normal Force (Upwards) -->
    <line x1="150" y1="180" x2="150" y2="145" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
    <text x="156" y="155" class="label-bold" fill="#38bdf8">R = 20 N (Up)</text>

    <!-- Weight Force (Downwards) -->
    <line x1="150" y1="230" x2="150" y2="265" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
    <text x="156" y="260" class="label-bold" fill="#38bdf8">W = 20 N (Down)</text>

    <!-- Explanation Box -->
    <rect x="47" y="275" width="206" height="123" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="57" y="297" class="label-bold" fill="#f8fafc">State: At Rest (v = 0 m/s)</text>
    <text x="57" y="319" class="label-dim">Vertical forces are balanced:</text>
    <text x="57" y="339" class="formula-badge" fill="#38bdf8">R - W = 20N - 20N = 0 N</text>
    <text x="57" y="361" class="label-dim">Resultant Force: F_net = 0 N</text>
    <text x="57" y="383" class="label-bold" fill="#7dd3fc">• Object remains motionless</text>
  </g>

  <!-- ================= STAGE 2: CONSTANT VELOCITY ================= -->
  <g id="stage2">
    <!-- Stage Card Container -->
    <rect x="285" y="95" width="230" height="315" rx="12" fill="url(#cardBg)" stroke="#1e293b" stroke-width="1.5"/>
    <!-- Header Badge -->
    <rect x="297" y="107" width="206" height="28" rx="6" fill="#047857" fill-opacity="0.35" stroke="#34d399" stroke-width="1"/>
    <text x="400" y="126" text-anchor="middle" class="stage-title" fill="#34d399">Stage 2: Constant Velocity</text>

    <!-- Visual Area: Frictionless Surface Track -->
    <line x1="300" y1="230" x2="500" y2="230" stroke="#334155" stroke-width="3"/>
    <text x="400" y="245" text-anchor="middle" class="label-dim" fill="#64748b">Frictionless Track (F_fric = 0)</text>

    <!-- Gliding Cart with Clip Container -->
    <g>
      <svg x="300" y="150" width="190" height="80" viewBox="0 0 190 80">
        <g class="gliding-cart">
          <!-- Cart body -->
          <rect x="10" y="30" width="65" height="45" rx="6" fill="#059669" stroke="#6ee7b7" stroke-width="2"/>
          <text x="42" y="58" text-anchor="middle" class="label-bold" fill="#ffffff">Mass (m)</text>
          <!-- Wheels -->
          <circle cx="24" cy="75" r="5" fill="#94a3b8"/>
          <circle cx="60" cy="75" r="5" fill="#94a3b8"/>
          <!-- Velocity vector arrow -->
          <line x1="75" y1="52" x2="110" y2="52" stroke="#34d399" stroke-width="2.5" marker-end="url(#arrow-green)"/>
          <text x="80" y="43" class="label-bold" fill="#34d399">v = const</text>
        </g>
      </svg>
    </g>

    <!-- Explanation Box -->
    <rect x="297" y="275" width="206" height="123" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="307" y="297" class="label-bold" fill="#f8fafc">State: Uniform Motion (a = 0)</text>
    <text x="307" y="319" class="label-dim">No horizontal resultant force:</text>
    <text x="307" y="339" class="formula-badge" fill="#34d399">F_thrust = 0, F_drag = 0</text>
    <text x="307" y="361" class="label-dim">Resultant Force: F_net = 0 N</text>
    <text x="307" y="383" class="label-bold" fill="#6ee7b7">• Velocity &amp; direction constant</text>
  </g>

  <!-- ================= STAGE 3: UNBALANCED FORCE &amp; INERTIA ================= -->
  <g id="stage3">
    <!-- Stage Card Container -->
    <rect x="535" y="95" width="230" height="315" rx="12" fill="url(#cardBg)" stroke="#1e293b" stroke-width="1.5"/>
    <!-- Header Badge -->
    <rect x="547" y="107" width="206" height="28" rx="6" fill="#b91c1c" fill-opacity="0.35" stroke="#f87171" stroke-width="1"/>
    <text x="650" y="126" text-anchor="middle" class="stage-title" fill="#f87171">Stage 3: Unbalanced Force</text>

    <!-- Visual Area: Track and Solid Barrier -->
    <line x1="550" y1="230" x2="750" y2="230" stroke="#475569" stroke-width="3"/>
    <!-- Barrier Block -->
    <rect x="710" y="165" width="18" height="65" rx="3" fill="#dc2626" stroke="#fca5a5" stroke-width="1.5"/>
    <text x="719" y="156" text-anchor="middle" class="label-bold" fill="#f87171">Barrier</text>

    <!-- Animated Cart &amp; Passenger -->
    <g class="collision-cart">
      <!-- Cart -->
      <rect x="570" y="180" width="65" height="45" rx="6" fill="#334155" stroke="#cbd5e1" stroke-width="2"/>
      <!-- Wheels -->
      <circle cx="584" cy="225" r="5" fill="#94a3b8"/>
      <circle cx="620" cy="225" r="5" fill="#94a3b8"/>
      <!-- Contact force arrow on impact (points left) -->
      <line x1="635" y1="202" x2="595" y2="202" stroke="#f87171" stroke-width="2.5" marker-end="url(#arrow-red)"/>
      <text x="565" y="173" class="label-bold" fill="#f87171">F_barrier (Left)</text>
    </g>

    <!-- Unrestrained Mass (Inertia Demonstration) -->
    <g class="inertia-mass">
      <circle cx="602" cy="170" r="10" fill="#fbbf24" stroke="#fef08a" stroke-width="1.5"/>
      <text x="602" y="153" text-anchor="middle" class="label-bold" fill="#fbbf24">Inertia</text>
    </g>

    <!-- Explanation Box -->
    <rect x="547" y="275" width="206" height="123" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="557" y="297" class="label-bold" fill="#f8fafc">State: Deceleration (a ≠ 0)</text>
    <text x="557" y="319" class="label-dim">Unbalanced contact force acts:</text>
    <text x="557" y="339" class="formula-badge" fill="#f87171">F_net = F_barrier ≠ 0 N</text>
    <text x="557" y="361" font-size="11" class="label-dim">Cart stops; mass continues ahead</text>
    <text x="557" y="383" class="label-bold" fill="#fca5a5">• Non-zero F changes velocity</text>
  </g>

  <!-- ================= BOTTOM KEY TAKEAWAY BANNER ================= -->
  <rect x="35" y="425" width="730" height="55" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="50" y="448" class="label-bold" fill="#38bdf8">GCSE Key Summary Rule:</text>
  <text x="50" y="468" font-size="11" class="label-dim" fill="#e2e8f0">• Velocity is constant: Object stays at rest or moves at steady speed.</text>
  <text x="420" y="448" font-size="12" class="label-bold" fill="#f87171">If Resultant Force ≠ 0 (Unbalanced):</text>
  <text x="420" y="468" font-size="10" class="label-dim" fill="#e2e8f0">• Velocity changes: Object accelerates or decelerates.</text>
</svg>